  --bg:#F7F8FA; --card:#FFFFFF; --ink:#14171C; --ink-2:#3B414B; --muted:#8A919C; --faint:#B7BCC4;
  --line:#E7E9ED; --line-2:#EFF1F4;
  --green:#15704F; --green-2:#1E8A62; --green-soft:#E3F4EA; --green-ink:#1B7A55; --green-mid:#9FD3BA;
  --on-green:#FFFFFF; --dot:#FFFFFF; --head-bg:rgba(247,248,250,.94);
  --n1:#1E9E68; --n2:#E0A21C; --n3:#3B7FE0;
  --orange:#F2822B;
}
html[data-tema="escuro"]{
  --bg:#0F1319; --card:#171D26; --ink:#EAEEF4; --ink-2:#C2C9D4; --muted:#8A94A3; --faint:#5D6673;
  --line:#28303B; --line-2:#20272F;
  --green:#3FBF8E; --green-2:#46CC98; --green-soft:#163228; --green-ink:#56D3A4; --green-mid:#2B6A55;
  --on-green:#0B1A14; --dot:#171D26; --head-bg:rgba(15,19,25,.94);
  --n1:#3FBF8E; --n2:#E8B440; --n3:#5C9BF0;
}
html{background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
header{position:relative;position:sticky;top:0;z-index:5;background:var(--head-bg);backdrop-filter:blur(8px);
  display:flex;align-items:stretch;gap:36px;padding:0 40px;border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--green) 0%,#7FC4A5 45%,rgba(242,130,43,.55) 100%)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;padding:26px 0}
.brand b{font-weight:700;letter-spacing:.22em;font-size:15px}
.brand span{color:var(--muted);font-weight:300;font-size:14px}
.brand i{width:1px;height:18px;background:var(--line);display:block}
.tabs{display:flex;gap:6px}
.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:0 30px;position:relative;color:var(--muted);transition:color .15s}
.tab:hover{color:var(--ink-2)}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);transition:background .15s}
.tab .tt{display:block;font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.tab .st{display:block;font-size:12px;color:var(--faint);margin-top:1px;letter-spacing:0}
.tab.on{color:var(--green)}
.tab.on .dot{background:var(--green)}
.tab.on .st{color:var(--muted)}
.tab.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--green);border-radius:2px}
.tema{all:unset;cursor:pointer;align-self:center;margin-left:18px;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);
  transition:color .15s,border-color .15s}
.tema:hover{color:var(--green);border-color:var(--green)}
html[data-tema="escuro"] .tema{color:var(--faint)}
html[data-tema="escuro"] .tema .rays{display:none}
html:not([data-tema="escuro"]) .tema{color:var(--orange);border-color:#F5D9BE}
header .src{margin-left:auto;display:flex;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:44px 40px 80px}
.sec{display:flex;align-items:center;gap:16px;margin:0 0 26px}
.sec span{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--green-ink);font-weight:500;white-space:nowrap}
.sec i{flex:1;height:1px;background:var(--line)}
.sec.muted span{color:var(--muted)}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:end;margin-bottom:64px}
.period{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.arrow{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);font-size:15px;background:var(--card);transition:border-color .15s}
.arrow:hover{border-color:var(--green)}
.arrow[disabled]{opacity:.35;cursor:default;border-color:var(--line)}
.period .lbl{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--green-ink);font-weight:500;min-width:150px;text-align:center}

.big{display:flex;align-items:baseline;gap:4px;margin:4px 0 30px;line-height:1}
.big .c{font-size:28px;font-weight:400;color:var(--ink-2)}
.big .i{font-size:68px;font-weight:600;letter-spacing:-.02em}
.big .d{font-size:28px;font-weight:400;color:var(--ink-2)}
.cap{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 30px}
.stat .v{font-size:19px;font-weight:600;margin-top:6px;white-space:nowrap}
.stat .v small{font-size:13px;color:var(--muted);font-weight:400}

/* painel direito */
.side-vis{padding-bottom:6px}
.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line-2);margin:14px 0 18px}
.dist i{display:block;height:100%}
.legend{display:flex;gap:26px;flex-wrap:wrap}
.legend div{display:flex;flex-direction:column;gap:2px}
.legend b{font-size:24px;font-weight:600;line-height:1.1}
.legend span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.winners{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px}
.winners .w{background:var(--green-soft);color:var(--green);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:500}
.winners .none{color:var(--faint);font-size:12.5px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{font-size:10px;fill:var(--muted);letter-spacing:.12em}

/* ---------- ranking ---------- */
.rk-head{display:flex;align-items:center;gap:16px;margin:0 0 8px}
.rk-head .sec{flex:1;margin:0}
.search,.sel{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-size:12.5px;outline:none;color:var(--ink-2)}
.search{width:220px}
.search:focus,.sel:focus{border-color:var(--green)}
table{width:100%;border-collapse:collapse}
thead th{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500;
  text-align:left;padding:16px 12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right} th.c,td.c{text-align:center}
tbody td{padding:18px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover td{background:var(--line-2)}
.pos{width:44px;color:var(--faint);font-size:13px;font-weight:500}
.nm b{font-weight:500;font-size:14px;display:block}
.nm small{color:var(--muted);font-size:11.5px}
.val{font-weight:500;font-size:14px}
.val.ok{color:var(--green-2)}
.bar{height:3px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden;min-width:110px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink-2);opacity:.55}
.bar i.ok{background:var(--green-2);opacity:1}
.sub{font-size:11px;color:var(--muted);margin-top:3px}
.pill{display:inline-block;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:500;white-space:nowrap;
  border:1px solid var(--line);color:var(--muted);background:var(--card)}
.pill.win{background:var(--green);border-color:var(--green);color:var(--on-green)}

/* barras de nível */
.lv3{display:flex;gap:10px;margin-top:10px}
.lv{flex:1;min-width:56px;max-width:92px}
.lv .t{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lv .t em{font-style:normal;color:var(--faint)}
.lv .b{height:5px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}
.lv .b i{display:block;height:100%;border-radius:99px;background:var(--c);opacity:.5;transition:width .5s}
.lv.done .b i{opacity:1}
.lv.done .t{color:var(--c)}
.lv.done .t em{color:var(--c)}
.gap{font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap}
.gap.ok{color:var(--green-2)}
.prz{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.more{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;color:var(--ink-2);font-size:13px;transition:border-color .15s,transform .2s}
.more:hover{border-color:var(--green)}
.more.open{transform:rotate(180deg);border-color:var(--green);color:var(--green)}
tr.res td{background:transparent;padding:0 12px 22px;border-bottom:1px solid var(--line-2)}
tr.res:hover td{background:transparent}
.resbox{margin-left:44px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}

/* ---------- helpers ---------- */
const BRL=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const BRLc=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pct=(v,m)=>Math.max(0,Math.min(100,m>0?v/m*100:0));
function big(v){
  const [i,d]=v.toFixed(2).split('.');
  return `<span class="c">R$</span><span class="i">${(+i).toLocaleString('pt-BR')}</span><span class="d">,${d}</span>`;
}
function curto(v){
  if(v>=1e6) return "R$ "+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+" mi";
  if(v>=1e3) return "R$ "+Math.round(v/1e3).toLocaleString('pt-BR')+" mil";
  return BRL(v);
}

/* ---------- agregação ---------- */
function agrega(meses){
  const set=new Set(meses), out=new Map(), segS=new Set(CFG.seg), batS=new Set(CFG.bat);
  for(const [vi,mi,gi,pi,r,q] of DADOS.linhas){
    if(!set.has(DADOS.meses[mi])) continue;
    let o=out.get(vi); if(!o){o={vi,fat:0,seg:0,bat:0};out.set(vi,o)}
    o.fat+=r;
    if(segS.has(DADOS.grupos[gi])) o.seg+=r;
    if(batS.has(DADOS.produtos[pi])) o.bat+=q;
  }
  return [...out.values()].map(o=>{const v=DADOS.vendedores[o.vi];
    return {...o,nome:v.n,time:timeDe(v.n,v.t),insc:PARTICIPANTES[v.n]||null}});
}
/* inscritos sem venda no período também aparecem, zerados */
function comInscritos(lista,camp){
  const tem=new Set(lista.map(o=>o.nome));
  const times=new Map(DADOS.vendedores.map(v=>[v.n,v.t]));
  for(const [n,c] of Object.entries(PARTICIPANTES))
    if(c===camp && !tem.has(n)) lista.push({nome:n,time:timeDe(n,times.get(n)||"—"),insc:c,fat:0,seg:0,bat:0});
  return lista.filter(o=>o.insc===camp);
}
function nivelDe(o){let a=0;for(const nv of CFG.niveis) if(o.fat>=nv.fat&&o.seg>=nv.seg&&o.bat>=nv.bat) a=nv.n;return a}
function premio(o){
  if(o.nivel===1) return {txt:BRL(o.fat*0.01),v:o.fat*0.01};
  if(o.nivel===2){const x=Math.max(0,o.fat-3750000)*0.012;return {txt:x>0?"Viagem + "+BRL(x):"Viagem R$ 45.000",v:45000+x}}
  if(o.nivel===3) return {txt:"Carro 0 km",v:0};
  return {txt:"—",v:0};
}

function go(v){

    document.getElementById("v-"+k).classList.toggle("hidden",v!==k);
    document.getElementById("tab-"+k).classList.toggle("on",v===k);
  }
  window.scrollTo({top:0});

}
function navMes(d){
  const i=MESES_CAMP.indexOf(mesSel)+d;
  if(i>=0&&i<MESES_CAMP.length){mesSel=MESES_CAMP[i];render()}
}
function filtra(lista,pref){
  const t=document.getElementById(pref+"-time").value, q=norm(document.getElementById(pref+"-busca").value.trim());
  return lista.filter(o=>(t==="*"||o.time===t)&&(!q||norm(o.nome).includes(q)||norm(nomeDe(o.nome)).includes(q)));
}

function renderM(){
  const M=CFG.mensal, [a,m]=mesSel.split("-");

/* ---------- High Ticket ---------- */
function barrasNivel(o){
  return '<div class="lv3">'+CFG.niveis.map(nv=>{
    const pf=pct(o.fat,nv.fat), ps=pct(o.seg,nv.seg), pb=pct(o.bat,nv.bat);
    const p=(pf+ps+pb)/3, done=o.fat>=nv.fat&&o.seg>=nv.seg&&o.bat>=nv.bat;
    const cor=["","var(--n1)","var(--n2)","var(--n3)"][nv.n];
    const tip=`Nível ${nv.n} — faturamento ${Math.round(pf)}% · seguro e limpeza ${Math.round(ps)}% · baterias ${Math.round(pb)}%`;
    return `<div class="lv ${done?'done':''}" style="--c:${cor}" title="${tip}">
      <div class="t"><span>Nível ${nv.n}</span><em>${Math.round(p)}%</em></div>
      <div class="b"><i style="width:${p}%"></i></div></div>`;
  }).join("")+'</div>';
}
function resumo(o){
  const cores=["","var(--n1)","var(--n2)","var(--n3)"];
  const bloco=(rot,chave,fmt,fmtGap)=>{
    const v=o[chave];
    const prox=CFG.niveis.find(nv=>v<nv[chave]);
    return `<div class="obj">
      <div class="cap">${rot}</div>
      <div class="now num">${fmt(v)}</div>
      <ul>${CFG.niveis.map(nv=>{const ok=v>=nv[chave];
        return `<li class="${ok?'ok':''}" style="--c:${cores[nv.n]}">
          <span class="k">Nível ${nv.n}</span>
          <span class="b"><i style="width:${pct(v,nv[chave])}%"></i></span>
          <span class="m">${ok?'✓ ':''}${fmt(nv[chave])}</span></li>`}).join("")}</ul>
      <div class="nx">${prox?`Falta <b>${fmtGap(prox[chave]-v)}</b> para o nível ${prox.n}`:'<b style="color:var(--n3)">Todos os níveis atingidos</b>'}</div>
    </div>`;
  };
  const un=n=>n+(n===1?' unidade':' unidades');
  return `<tr class="res"><td colspan="6"><div class="resbox">
    ${bloco("Faturamento","fat",BRL,BRLc)}
    ${bloco("Seguro e limpeza","seg",BRL,BRLc)}
    ${bloco("Baterias","bat",un,un)}
  </div></td></tr>`;
}
function renderS(){
  const meses=CFG.semestre.filter(m=>DADOS.meses.includes(m));
  const empresa=agrega(meses);
  const total=empresa.reduce((a,b)=>a+b.fat,0);
  const todos=comInscritos(empresa,"03");
  todos.forEach(o=>{o.nivel=nivelDe(o);o.pr=premio(o)});
  const prem=todos.filter(o=>o.nivel), valor=prem.reduce((a,b)=>a+b.pr.v,0);
  const p=total/CFG.coletiva*100;

  document.getElementById("s-big").innerHTML=big(total);
  document.getElementById("s-stats").innerHTML=`
    <div class="stat"><div class="cap">Atingido</div><div class="v num" style="color:var(--green-ink)">${p.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</div></div>
    <div class="stat"><div class="cap">Meta</div><div class="v num">${curto(CFG.coletiva)}</div></div>
    <div class="stat"><div class="cap">${total>=CFG.coletiva?'Excedente':'Faltam'}</div><div class="v num">${curto(Math.abs(CFG.coletiva-total))}</div></div>
    <div class="stat"><div class="cap">Premiados</div><div class="v num">${prem.length} <small>de ${todos.length}</small></div></div>
    <div class="stat"><div class="cap">Prêmio estimado</div><div class="v num">${BRL(valor)}</div></div>`;

  /* gráfico acumulado do semestre */
  let acc=0;
  const pts=CFG.semestre.map(m=>{
    if(!DADOS.meses.includes(m)) return null;
    acc+=agrega([m]).reduce((a,b)=>a+b.fat,0); return acc;
  });
  const W=560,H=220,pl=4,pr=4,pt=16,pb=30, max=Math.max(CFG.coletiva*1.08,acc);
  const x=i=>pl+i*(W-pl-pr)/5, y=v=>pt+(H-pt-pb)*(1-v/max);
  const real=pts.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
  const linha=real.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const area=real.length?linha+` L${real.at(-1)[0].toFixed(1)} ${y(0)} L${real[0][0].toFixed(1)} ${y(0)} Z`:"";
  const ultimo=real.at(-1);
  document.getElementById("s-vis").innerHTML=`
    <div class="cap" style="margin-bottom:14px">Faturamento acumulado no semestre</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento acumulado">
      <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--green-2)" stop-opacity=".18"/><stop offset="1" stop-color="var(--green-2)" stop-opacity="0"/></linearGradient></defs>
      <line x1="${pl}" x2="${W-pr}" y1="${y(CFG.coletiva)}" y2="${y(CFG.coletiva)}" stroke="var(--faint)" stroke-dasharray="4 5"/>
      <text x="${W-pr}" y="${y(CFG.coletiva)-7}" text-anchor="end" class="axis">META ${curto(CFG.coletiva).toUpperCase()}</text>
      <line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
      ${area?`<path d="${area}" fill="url(#gA)"/>`:""}
      ${linha?`<path d="${linha}" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`:""}
      ${real.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.2" fill="var(--card)" stroke="var(--green)" stroke-width="2"/>`).join("")}
      ${ultimo?`<text x="${Math.min(ultimo[0]+8,W-90)}" y="${ultimo[1]-10}" class="axis" style="fill:var(--green);font-weight:600">${curto(acc).toUpperCase()}</text>`:""}
      ${MESC.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===5?'end':'middle'}" class="axis">${l}</text>`).join("")}
    </svg>`;

  const lista=filtra(todos,"s").sort((a,b)=>(b.nivel-a.nivel)||(b.fat-a.fat));
  const tb=document.getElementById("s-body");
  if(!lista.length){tb.innerHTML='<tr><td colspan="6" class="empty">Nenhum representante encontrado</td></tr>';return}
  const N1=CFG.niveis[0];
  tb.innerHTML=lista.map((o,k)=>`<tr>
      <td class="pos num">${k+1}º</td>
      <td class="nm"><b>${esc(nomeDe(o.nome))}</b><small>${esc(o.time)}</small>${barrasNivel(o)}</td>
      <td class="r"><div class="val num ${o.fat>=N1.fat?'ok':''}">${BRL(o.fat)}</div></td>
      <td class="r"><div class="val num ${o.seg>=N1.seg?'ok':''}">${BRL(o.seg)}</div></td>
      <td class="c"><div class="val num ${o.bat>=N1.bat?'ok':''}">${o.bat}</div></td>
      <td class="r"><div class="prz"><span class="pill ${o.nivel?'win':''}">${o.nivel?'Nível '+o.nivel+' · '+o.pr.txt:'—'}</span>
        <button class="more ${aberto===o.nome?'open':''}" title="Resumo dos objetivos" onclick="toggleRes('${esc(o.nome).replace(/'/g,"\\'")}')">⌄</button></div></td>
    </tr>${aberto===o.nome?resumo(o):''}`).join("");
}

const corta=(s,n)=>s.length>n?s.slice(0,n-1).trim()+"…":s;
/* prêmio já garantido, ou o aproximado se completasse as metas */
const obsNivel=n=>n===1?"1% do faturamento":n===2?"viagem + 1,2%":"carro 0 km";
function premioPotencial(o){
  if(o.nivel) return {...premio(o), real:true, obs:obsNivel(o.nivel)};
  let nv=1; for(const n of CFG.niveis) if(o.fat>=n.fat) nv=n.n;
  const base=Math.max(o.fat,CFG.niveis[nv-1].fat);
  return {...premio({nivel:nv,fat:base}), real:false, nv, obs:obsNivel(nv)};
}
/* avanço de 0 a 1 na campanha: níveis inteiros + fração do próximo */
function avanco(o){
  if(o.nivel>=3) return 1;
  const nv=CFG.niveis[o.nivel];
  const f=(Math.min(1,o.fat/nv.fat)+Math.min(1,o.seg/nv.seg)+Math.min(1,o.bat/nv.bat))/3;
  return (o.nivel+f)/3;
}

/* fundo do cabeçalho: pista em velocidade + bandeira quadriculada ondulada por cima */
function fundoTema(){
  const W=1200,H=244;
  let q="";
  /* bandeira ondulada: 14 colunas x 6 linhas, com deslocamento senoidal */
  const c0=-24,cw=46,ch=32;
  for(let c=0;c<28;c++) for(let l=0;l<9;l++){
    const x=c0+c*cw, dy=Math.sin((c/9)*Math.PI)*15, sk=Math.cos((c/9)*Math.PI)*8;
    const y=-22+l*ch+dy;
    q+=`<path d="M${x} ${y} L${x+cw} ${y+sk} L${x+cw} ${y+ch+sk} L${x} ${y+ch} Z"
        fill="${(c+l)%2?'#FFFFFF':'#0A0C0F'}"/>`;
  }
  /* rastros de velocidade */
  let r="";
  for(let i=0;i<22;i++){
    const y=8+((i*37)%232), w=60+((i*53)%240), x=((i*91)%900);
    r+=`<rect x="${x}" y="${y}" width="${w}" height="1.6" rx=".8" fill="#fff" opacity="${.03+(i%4)*.015}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="thsky" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0E1116"/><stop offset=".55" stop-color="#16303F"/><stop offset="1" stop-color="#0E1116"/>
      </linearGradient>
      <linearGradient id="thveil" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0E1116" stop-opacity=".97"/><stop offset=".34" stop-color="#0E1116" stop-opacity=".80"/>
        <stop offset=".58" stop-color="#0E1116" stop-opacity=".20"/><stop offset="1" stop-color="#0E1116" stop-opacity=".04"/>
      </linearGradient>
      <linearGradient id="thmg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff"/><stop offset=".30" stop-color="#fff"/>
        <stop offset=".52" stop-color="#777"/><stop offset=".68" stop-color="#000"/>
      </linearGradient>
      <mask id="thm"><rect width="${W}" height="${H}" fill="url(#thmg)"/></mask>
      <linearGradient id="thbr" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1E9E68"/><stop offset=".5" stop-color="#E0C21C"/><stop offset="1" stop-color="#1E9E68"/>
      </linearGradient>
    </defs>
    <g mask="url(#thm)" opacity=".45">${r}</g>
    <g mask="url(#thm)" opacity=".38">${q}</g>
    <rect width="${W}" height="${H}" fill="url(#thveil)"/>
    <rect y="${H-3}" width="${W}" height="3" fill="url(#thbr)" opacity=".85"/>
  </svg>`;
}

function renderT(){
  const meses=CFG.semestre.filter(m=>DADOS.meses.includes(m));
  const empresa=agrega(meses);
  const total=empresa.reduce((a,b)=>a+b.fat,0);
  const todos=comInscritos(empresa,"03");
  todos.forEach(o=>{o.nivel=nivelDe(o);o.pr=premioPotencial(o);o.av=avanco(o)});
  const top=[...todos].sort((a,b)=>b.av-a.av||b.fat-a.fat).slice(0,10);

  document.getElementById("th-ttl").innerHTML=TEMA.titulo;
  document.getElementById("th-sb").textContent=TEMA.sub;
  document.getElementById("th-foot").innerHTML=TEMA.rodape;
  document.getElementById("th-sec").textContent=TEMA.secao;
  document.getElementById("tab-t-sub").textContent=TEMA.menu;
  document.getElementById("th-bg").innerHTML=fundoTema();
  /* ---- grid de largada ---- */
  const L=58, H=66+top.length*L+26, X0=226, X1=948, W=1000;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grid da campanha">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#15181E"/>
    <rect x="${X0-26}" y="40" width="${X1-X0+52}" height="${H-66}" fill="#1C2026"/>`;
  /* bandeira quadriculada de chegada */
  for(let i=0;i<Math.ceil((H-66)/9);i++) for(let c=0;c<2;c++)
    s+=`<rect x="${X1+12+c*9}" y="${40+i*9}" width="9" height="9" fill="${(i+c)%2?'#fff':'#15181E'}"/>`;
  s+=`<text x="${X0-26}" y="30" font-size="8" fill="#5C6673" letter-spacing="1.6">LARGADA</text>
      <text x="${X1+30}" y="30" font-size="8" fill="#5C6673" letter-spacing="1.6" text-anchor="end">CHEGADA</text>`;

  top.forEach((o,i)=>{
    const y=50+i*L, lider=i===0;
    const cor=TEMA.cores[i%TEMA.cores.length];
    const px=X0+(X1-X0-70)*Math.max(.06,Math.min(1,o.av));
    const nm=corta(nomeDe(o.nome),21);
    const sel=o.nivel?`<text x="50" y="${y+40}" font-size="7.5" font-weight="600" fill="#2FBF71" letter-spacing=".6">NÍVEL ${o.nivel} CONQUISTADO</text>`:"";
    s+=`<rect x="${X0-26}" y="${y}" width="${X1-X0+52}" height="${L-6}" fill="${i%2?'#1F242B':'#1C2026'}"/>
        <line x1="${X0-26}" x2="${X1+12}" y1="${y+L-6}" y2="${y+L-6}" stroke="#262B33"/>
        <text x="30" y="${y+26}" font-size="15" font-weight="700" fill="${cor}" text-anchor="middle">${i+1}º</text>
        <text x="50" y="${y+18}" font-size="11.5" font-weight="600" fill="#fff">${esc(nm)}</text>
        <text x="50" y="${y+30}" font-size="9" fill="#79838F">${esc(o.time)}</text>${sel}`;
    if(lider) s+=chequeSVG(Math.max(X0-14,px-164),y+1,BRL(o.pr.v||0),esc(corta(nomeDe(o.nome),20)),o.pr.obs||"");
    else      s+=caixaSVG(Math.max(X0-14,px-136),y+5,BRL(o.pr.v||0),o.pr.real,o.pr.obs||"");
    s+=`<line x1="${Math.max(X0-14,px-8)}" x2="${px+4}" y1="${y+24}" y2="${y+24}" stroke="${cor}" stroke-width="1.5" stroke-dasharray="3 2" opacity=".7"/>`;
    s+=carroSVG(px,y+6,cor,i+1,i);
  });
  s+=`</svg>`;
  document.getElementById("th-grid").innerHTML=s;

  /* ---- cards ---- */
  const prem=todos.filter(o=>o.nivel);
  const potAll=todos.reduce((a,b)=>a+(b.pr.v||0),0);
  const garAll=todos.filter(o=>o.pr.real).reduce((a,b)=>a+(b.pr.v||0),0);
  const p=total/CFG.coletiva*100;
  document.getElementById("th-cards").innerHTML=`
    <div class="th-card"><div class="cap">Meta coletiva</div><div class="b num">${p.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</div>
      <div class="s">${curto(total)} de ${curto(CFG.coletiva)}</div></div>
    <div class="th-card"><div class="cap">Faltam</div><div class="b num">${curto(Math.max(0,CFG.coletiva-total))}</div>
      <div class="s">para liberar os prêmios</div></div>
    <div class="th-card"><div class="cap">Já no pódio</div><div class="b num">${prem.length} <span style="font-size:15px;color:var(--muted)">de ${todos.length}</span></div>
      <div class="s">com nível conquistado</div></div>
    <div class="th-card"><div class="cap">Em jogo</div><div class="b acc num">${BRL(potAll)}</div>
      <div class="s">os ${todos.length} inscritos · ${BRL(garAll)} já garantidos</div></div>`;
}

/* ---------- tema claro/escuro ---------- */
function aplicaTema(t){
  document.documentElement.setAttribute("data-tema",t);
  try{localStorage.setItem("solturi-tema",t)}catch(e){}
}
function trocaTema(){
  aplicaTema(document.documentElement.getAttribute("data-tema")==="escuro"?"claro":"escuro");
}

/* ---------- boot ---------- */
function render(){ view==="m"?renderM():view==="s"?renderS():renderT(); }
(function boot(){
  let tema="claro";
  try{tema=localStorage.getItem("solturi-tema")
     ||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro")}catch(e){}
  aplicaTema(tema);
  document.getElementById("src").textContent="Atualizado em "+DADOS.gerado;
  const fm={}; for(const [,mi,,,r] of DADOS.linhas){const m=DADOS.meses[mi];fm[m]=(fm[m]||0)+r}
  const pico=Math.max(...MESES_CAMP.map(m=>fm[m]||0));
  const cheios=MESES_CAMP.filter(m=>(fm[m]||0)>=pico*0.05);
  mesSel=(cheios.length?cheios:MESES_CAMP).at(-1);
  for(const [id,c] of [["m-time","02"],["s-time","03"]]){
    const times=[...new Set(DADOS.vendedores.filter(v=>PARTICIPANTES[v.n]===c).map(v=>timeDe(v.n,v.t)))].sort();
    document.getElementById(id).innerHTML='<option value="*">Todos os times</option>'+times.map(t=>`<option>${esc(t)}</option>`).join("");
  }
  render();
})();
</script>
